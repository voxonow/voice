name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Install browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end (two real browsers, real media)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build --target server -t voxonow-voice:ci .
      - name: Build demo image
        run: docker build --target demo -t voxonow-voice-demo:ci .
      - name: Server image runs and reports healthy
        run: |
          mkdir -p keys
          node -e "const {generateKeyPairSync}=require('crypto');const {publicKey}=generateKeyPairSync('ed25519');require('fs').writeFileSync('keys/pub.pem',publicKey.export({type:'spki',format:'pem'}))"
          docker run -d --name voice -p 7800:7800 \
            -e RTC_ANNOUNCED_ADDRESS=127.0.0.1 -e NUM_WORKERS=1 \
            -e TICKET_PUBLIC_KEY="$(cat keys/pub.pem)" voxonow-voice:ci
          for i in $(seq 1 30); do curl -fsS localhost:7800/healthz && exit 0; sleep 1; done
          docker logs voice; exit 1
      - name: Demo image runs and reports healthy
        run: |
          node -e "const {generateKeyPairSync}=require('crypto');const {privateKey}=generateKeyPairSync('ed25519');require('fs').writeFileSync('keys/priv.pem',privateKey.export({type:'pkcs8',format:'pem'}))"
          chmod 644 keys/priv.pem
          docker run -d --name demo -p 5173:5173 -e DEMO_HOST=0.0.0.0 \
            -e TICKET_PRIVATE_KEY_FILE=/keys/priv.pem -v "$PWD/keys:/keys:ro" voxonow-voice-demo:ci
          ready=""
          for i in $(seq 1 30); do curl -fsS localhost:5173/healthz && { ready=1; break; }; sleep 1; done
          [ -n "$ready" ] || { docker logs demo; exit 1; }
          # Ready means it serves what a browser needs, not just that it listens.
          curl -fsS localhost:5173/ | grep -q 'voiceDemo\|app.js'
          curl -fsS -o /dev/null localhost:5173/app.js
          curl -fsS -X POST -H 'content-type: application/json' -d '{"room":"ci","name":"ci"}' localhost:5173/api/ticket | grep -q '"ticket":"ey'
